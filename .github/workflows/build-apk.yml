name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies & Build Vite
        run: |
          npm install
          npm install vite-plugin-pwa @capacitor/core @capacitor/cli @capacitor/android
          npx vite build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap init "AmanaOffice" "com.amana.office" --web-dir "dist"
          npx cap add android || true
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes & Build APK
        run: |
          # إضافة معالجة تعارض مكتبات كوتلن تلقائياً
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amana-Office-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
